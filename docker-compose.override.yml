# Local dev convenience ports. Docker Compose merges this automatically with
# docker-compose.yml, no extra flags needed. Publishes the services that
# normally stay on the private network, plus Postgres/Redis/Garage, so they can
# be inspected directly without going through the gateway.
#
# Do not carry this file to a host outside localhost. docker-compose.yml alone
# already exposes exactly what should be public.

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  # S3 API, to look at the buckets with a key. The admin API stays private.
  garage:
    ports:
      - "3900:3900"

  identity-service:
    ports:
      - "${IDENTITY_PORT}:8000"

  classroom-service:
    ports:
      - "${CLASSROOM_PORT}:8000"

  content-service:
    ports:
      - "${CONTENT_PORT}:8000"

  notification-service:
    ports:
      - "${NOTIFICATION_PORT}:8000"
