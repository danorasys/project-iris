# IRIS CI. On every PR and on push to main, this checks the code: lint, type
# checks and tests for the 5 backend services (one job per service) and the
# frontend, a dependency audit and a secrets scan.
# It does not build images or deploy anything. Images are built, scanned and
# signed only when a version tag is pushed, see release.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, this workflow never publishes anything.
permissions:
  contents: read

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - classroom-service
          - content-service
          - notification-service
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests --line-length 120

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true # Not blocking yet. Enable "--strict" progressively as the rest of the code gets typed.

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true # Informational warning only, it does not block the merge yet. Harden this (fail the job on findings) before production.

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: frontend / apps-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Tests
        run: npm run test --workspace apps/web

      - name: Dependency audit
        run: npm audit --omit=dev || true # Informational warning only, it does not block the merge yet. Harden this (fail the job on findings) before production.

      - name: Build
        run: npm run build --workspace apps/web

  secrets:
    name: secrets scan / gitleaks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history, a secret removed later is still in old commits.
          fetch-depth: 0

      # Runs the official image instead of the marketplace action, which asks
      # for a license on organizations. The version is pinned.
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose
