# IRIS CI. Checks every pull request and every push to main:
#   1. verify: lint, types, tests and dependency audit of each service and
#      the web app, a secrets scan of the whole history and a check of the
#      Dockerfiles.
#   2. images: builds and scans the six images. On main they are published
#      as release candidates (sha-<commit>), on pull requests they are not.
# It never deploys. Releases come from a version tag, see release.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# An explicit bash shell runs with pipefail, the default one does not.
defaults:
  run:
    shell: bash

# A new push to a pull request cancels its older run. On main every commit
# runs to the end, because only commits with a finished CI can be released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - classroom-service
          - content-service
          - notification-service
          - api-gateway
    uses: ./.github/workflows/_verify-python.yml
    with:
      service: ${{ matrix.service }}

  frontend:
    name: frontend / apps-web
    uses: ./.github/workflows/_verify-web.yml

  secrets-scan:
    name: secrets scan / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, a secret removed later is still in old commits.
          fetch-depth: 0

      # The official image, the marketplace action asks for a license on
      # organizations. Rules and exceptions are in .gitleaks.toml.
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose

  dockerfiles:
    name: dockerfiles / trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Dockerfiles
        run: bash scripts/ci/trivy-config-scan.sh

  # Images are only built when the code itself is fine.
  images:
    name: images / ${{ matrix.name }}
    needs: [backend, frontend, secrets-scan, dockerfiles]
    permissions:
      contents: read
      packages: write # only used on main, pull requests from forks never get it
      security-events: write # scan report to the Security tab, main only
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity-service, context: services/identity-service }
          - { name: classroom-service, context: services/classroom-service }
          - { name: content-service, context: services/content-service }
          - { name: notification-service, context: services/notification-service }
          - { name: api-gateway, context: services/api-gateway }
          # Built from the repo root, the Dockerfile needs packages/shared-types.
          - { name: web, context: ".", file: apps/web/Dockerfile, target: runtime }
    uses: ./.github/workflows/_image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file || '' }}
      target: ${{ matrix.target || '' }}
      push: ${{ github.event_name == 'push' }}
