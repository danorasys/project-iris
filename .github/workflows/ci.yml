# IRIS CI. On every PR and on push to main, this runs lint, type checks and
# tests for the 5 backend services (one job per service) and the frontend.
# Only on push to main, and only if those checks pass, it also builds and
# publishes a Docker image per service plus the apps/web image to GHCR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - classroom-service
          - content-service
          - notification-service
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests --line-length 120

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true # Not blocking yet. Enable "--strict" progressively as the rest of the code gets typed.

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true # Informational warning only, it does not block the merge yet. Harden this (fail the job on findings) before production.

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: frontend / apps-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Tests
        run: npm run test --workspace apps/web

      - name: Dependency audit
        run: npm audit --omit=dev || true # Informational warning only, it does not block the merge yet. Harden this (fail the job on findings) before production.

      - name: Build
        run: npm run build --workspace apps/web

  build-and-push:
    name: Build & push images (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - identity-service
          - classroom-service
          - content-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push — ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  build-and-push-web:
    name: Build & push image (GHCR) — apps/web
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push — apps/web (runtime nginx)
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root, not apps/web, same reason as in
          # docker-compose.yml: the Dockerfile needs packages/shared-types
          # as a sibling directory to copy into the image.
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          # Vite bakes this into the compiled JS at build time (see
          # apps/web/Dockerfile), so the published image has to be built
          # with the real production URL — otherwise it silently ships
          # with the Dockerfile's localhost default. PROD_API_BASE_URL is
          # a repo variable (Settings > Secrets and variables > Actions >
          # Variables), not a secret, since it's just a public URL.
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    name: Deploy to production (VPS)
    needs: [build-and-push, build-and-push-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Requires a "production" GitHub Environment with required reviewers
    # configured (Settings > Environments) — that's what makes this job
    # pause for manual approval instead of deploying automatically. The
    # three secrets below are Environment secrets on "production", not
    # repo secrets, so only this job (post-approval) can read them.
    environment:
      name: production
      url: https://iris.bucaramanga.upb.edu.co
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The SSH server ignores this and always runs the forced
          # command in the deploy user's authorized_keys (scripts/deploy.sh)
          # regardless of what's requested here — the script reads this
          # SHA back out of $SSH_ORIGINAL_COMMAND to know which image tag
          # to pull. See scripts/deploy.sh for the validation.
          script: "${{ github.sha }}"
