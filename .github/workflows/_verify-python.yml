# Reusable: lint, type check, dependency audit and tests of one Python service.
# Called by ci.yml once per service.
name: Verify Python service

on:
  workflow_call:
    inputs:
      service:
        description: Folder name under services/
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ inputs.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests --line-length 120

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      # Any known vulnerability in a runtime dependency fails the build.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Tests (pytest)
        run: pytest -q
