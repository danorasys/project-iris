# Reusable: type check, lint, tests, dependency audit and build of apps/web.
name: Verify web

on:
  workflow_call:

permissions:
  contents: read

# An explicit bash shell runs with pipefail, the default one does not.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Node major as apps/web/Dockerfile, so the tests run on the version
      # that builds the bundle. Dependabot only bumps the Dockerfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Tests
        run: npm run test --workspace apps/web

      # Dev tools included, they run in the CI and on our machines too.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build --workspace apps/web
