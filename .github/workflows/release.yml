# IRIS release. Runs when a tag like v1.2.3 is pushed. It does not build
# anything: it takes the six release candidates the CI already built and
# scanned for that commit (sha-<commit>), scans them again, signs them and
# tags them with the version. Then it creates a pre-release on GitHub.
#
# The server never deploys a pre-release. A person marks it as "latest"
# (that click is the approval) and the server picks it up on its own, see
# scripts/iris-deploy.sh and docs/adr/0001-pull-based-deployment.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# An explicit bash shell runs with pipefail, the default one does not.
defaults:
  run:
    shell: bash

# One release at a time, and a release that started is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A tag can be pushed from any branch, so the commit must be in main and
  # its CI (which also built the candidates) must have passed.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The commit must be in main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main, refusing to release it."
            exit 1
          fi

      - name: The CI must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow CI --commit "$GITHUB_SHA" --event push --status completed \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Wait for it or fix it first."
            exit 1
          fi

  promote:
    name: Promote / ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign
    strategy:
      fail-fast: true
      matrix:
        name:
          - identity-service
          - classroom-service
          - content-service
          - notification-service
          - api-gateway
          - web
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Everything after this works on the digest, never on a tag, so nothing
      # can swap the image between the scan and the signature.
      - name: Find the candidate
        id: candidate
        run: |
          if ! digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
              --format '{{json .Manifest}}' | jq -re .digest); then
            echo "::error::No candidate $IMAGE:sha-$GITHUB_SHA. Old candidates are cleaned after 30 days, tag a recent commit."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Again, because new vulnerabilities may have been published since the CI.
      - name: Scan again (Trivy)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: bash scripts/ci/trivy-scan.sh "$IMAGE@$DIGEST"

      # Keyless: the signature is tied to this workflow and this tag through
      # the GitHub OIDC identity, there is no private key to keep or leak.
      - name: Sign (cosign)
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Tag with the version
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME points to $tagged, expected the signed $DIGEST."
            exit 1
          fi

  release:
    name: Create pre-release
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag \
            --notes "Images are scanned and signed. To deploy this version, mark this release as the latest release. The server will pick it up within a few minutes."
