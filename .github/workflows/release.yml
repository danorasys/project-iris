# IRIS release. Runs when a tag like v1.2.3 is pushed. It builds the six
# images, scans them, signs them and creates a pre-release on GitHub.
# The server never deploys a pre-release: a person marks it as "latest"
# (that click is the approval) and the server picks it up on its own, see
# scripts/iris-deploy.sh and docs/adr/0001-pull-based-deployment.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Read-only by default. Each job asks for the extra permission it needs.
permissions:
  contents: read

# One release at a time, and a release that started is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # A tag can be pushed from any branch, so before building anything we check
  # that the commit is in main and that the CI passed for it.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: The commit must be in main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main, refusing to release it."
            exit 1
          fi

      - name: The CI must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "$GITHUB_SHA" --status completed \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${conclusion:-0}" -lt 1 ]; then
            echo "::error::No successful CI run found for $GITHUB_SHA."
            exit 1
          fi

  images:
    name: Image / ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: identity-service, context: services/identity-service }
          - { name: classroom-service, context: services/classroom-service }
          - { name: content-service, context: services/content-service }
          - { name: notification-service, context: services/notification-service }
          - { name: api-gateway, context: services/api-gateway }
          # The web image is built from the repo root, the Dockerfile needs
          # packages/shared-types as a sibling directory.
          - { name: web, context: ".", file: apps/web/Dockerfile, target: runtime }
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action v4.6.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action v7.4.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # Vite bakes this URL into the bundle at build time. It is a repo
          # variable (not a secret) because it is just a public URL. The other
          # images ignore it.
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
          # SBOM and provenance are stored in the registry next to the image.
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}

      # The image is already in the registry at this point, but it is not
      # signed. The server only accepts signed images, so a failed scan here
      # keeps a vulnerable image from ever being deployed.
      # aquasecurity/trivy-action v0.36.0
      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # sigstore/cosign-installer v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      # Keyless: the signature is tied to this workflow and this tag through
      # the GitHub OIDC identity, there is no private key to keep or leak.
      - name: Sign the image (cosign)
        run: cosign sign --yes "${IMAGE_PREFIX}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  # Only when the six images are built, scanned and signed.
  release:
    name: Create pre-release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag \
            --notes "Images are built, scanned and signed. To deploy this version, mark this release as the latest release. The server will pick it up within a few minutes."
