# Dependabot opens weekly pull requests to update dependencies. Each one goes
# through the same CI (tests and image scan) before it can be merged.
#
# Updates are grouped by risk. Minor versions, patches and dev tools come
# grouped, one pull request for all the services at once. A major version of
# something that runs in production gets its own pull request, because it is
# the kind that can break things and needs its release notes read.
#
# The service folders are listed one by one on purpose. With a "/services/*"
# pattern Dependabot also scans "/services" as a whole and every update shows
# up twice.
version: 2
updates:
  # The actions are pinned by SHA, Dependabot moves the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of our Dockerfiles, like the nginx one that had the OpenSSL issue.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/api-gateway
      - /services/classroom-service
      - /services/content-service
      - /services/identity-service
      - /services/notification-service
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Images used directly in the compose files (postgres, redis, caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Postgres gets its own pull request. A new major one is still suggested,
    # but the CI keeps it red until the data migration of scripts/pg-upgrade.sh
    # is done (see scripts/ci/postgres-version.sh).
    groups:
      compose-images:
        patterns: ["*"]
        exclude-patterns: ["postgres"]

  - package-ecosystem: pip
    directories:
      - /services/api-gateway
      - /services/classroom-service
      - /services/content-service
      - /services/identity-service
      - /services/notification-service
    schedule:
      interval: weekly
    groups:
      # Test and lint tools, any version: they never reach production.
      python-dev-tools:
        dependency-type: development
      python-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      # One pull request per package, still covering the five services.
      python-major:
        dependency-type: production
        update-types: [major]
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major versions are left out of the group, so each one gets its own
    # pull request.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
