# Dependabot opens weekly pull requests to update dependencies. Each one goes
# through the same CI (tests and image scan) before it can be merged. Updates
# are grouped so there are a few pull requests a week instead of dozens.
version: 2
updates:
  # The actions are pinned by SHA, Dependabot moves the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of our Dockerfiles, like the nginx one that had the OpenSSL issue.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/*
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Images used directly in the compose files (postgres, redis, caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Postgres gets its own pull request. A new major one is still suggested,
    # but the CI keeps it red until the data migration of scripts/pg-upgrade.sh
    # is done (see scripts/ci/postgres-version.sh).
    groups:
      compose-images:
        patterns: ["*"]
        exclude-patterns: ["postgres"]

  - package-ecosystem: pip
    directories:
      - /services/*
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
