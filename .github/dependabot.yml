# Dependabot opens weekly pull requests to update dependencies. Each one goes
# through the same CI (tests and image scan) before it can be merged. Updates
# are grouped so there are a few pull requests a week instead of dozens.
version: 2
updates:
  # The actions are pinned by SHA, Dependabot moves the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of our Dockerfiles, like the nginx one that had the OpenSSL issue.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/*
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Images used directly in the compose files (postgres, redis, caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    # A new Postgres major can not read the old data, it needs the planned
    # migration of scripts/pg-upgrade.sh. Minor versions are fine.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - /services/*
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
